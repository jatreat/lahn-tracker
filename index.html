<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
<title>Lahn Election Day Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: campaign war-room board. Green masthead with the wordmark, tab rail, one working panel per tab: summary first, entry form, then the ledger. */
:root{
  --bg:#f6f5ee; --panel:#ffffff; --ink:#16231b; --muted:#5b665e; --rule:#dcdac8;
  --brand:#1a422b; --brand-ink:#e8e6cf; --accent:#1a422b; --accent-ink:#ffffff; --soft:#eceadb;
  --rep:#b4302e; --dem:#2f5da8; --np:#7d827a; --ok:#2f7a4a; --warn:#9a6a10; --warn-bg:#fbf1dc; --bad:#b4302e; --bad-bg:#f8e3e1;
  --display:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --panel:#16211a; --ink:#e8e6cf; --muted:#a3aa9c; --rule:#2b3a30;
  --brand:#14341f; --brand-ink:#e8e6cf; --accent:#8cc49f; --accent-ink:#0f1712; --soft:#1d2a22;
  --rep:#e5807c; --dem:#86a9e6; --np:#a8ada4; --ok:#7fc79a; --warn:#e6b85c; --warn-bg:#2b2516; --bad:#e5807c; --bad-bg:#33201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --panel:#16211a; --ink:#e8e6cf; --muted:#a3aa9c; --rule:#2b3a30;
  --brand:#14341f; --brand-ink:#e8e6cf; --accent:#8cc49f; --accent-ink:#0f1712; --soft:#1d2a22;
  --rep:#e5807c; --dem:#86a9e6; --np:#a8ada4; --ok:#7fc79a; --warn:#e6b85c; --warn-bg:#2b2516; --bad:#e5807c; --bad-bg:#33201f; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{background:var(--brand);color:var(--brand-ink)}
.mast .in{max-width:1180px;margin:0 auto;padding-block:16px 0;display:grid;gap:12px}
.mast .top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.mast img{height:22px;width:auto;max-width:100%;display:block}
.mast .meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.82rem;opacity:.9}
.mode{font:600 .7rem var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--brand-ink) 45%,transparent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:var(--brand-ink);text-decoration:none;font-weight:600;font-size:.92rem;padding:10px 14px;border-radius:8px 8px 0 0;white-space:nowrap;opacity:.78}
.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink);opacity:1}
.tabs a:focus-visible{outline:2px solid var(--brand-ink);outline-offset:-2px}
main{max-width:1180px;margin:0 auto;padding-block:20px 56px;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--muted);margin:.2rem 0 0;max-width:72ch}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.panel h2{margin:0;font-size:1.02rem;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
label{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:500 .98rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-width:0}
input[type=number]{font-family:var(--mono);width:8.5rem}
input.w-s{width:6.5rem} input.w-l{width:16rem} select{width:12rem} textarea{width:100%;min-height:4.2rem;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 .9rem var(--body);border-radius:6px;padding:9px 14px;cursor:pointer;border:1px solid var(--rule);background:var(--panel);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.link{border:none;background:none;color:var(--accent);padding:4px 6px;font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{border-top:3px solid var(--accent);background:var(--panel);border-radius:0 0 8px 8px;padding:10px 12px;min-width:0;border-left:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpi .v{font:500 1.6rem var(--mono);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .k{font-size:.8rem;color:var(--muted)}
.kpi a{color:inherit;text-decoration:none}
.kpi a:hover .k{text-decoration:underline}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap;vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--panel)}
th.l,td.l{text-align:left}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.t{font-family:var(--body);white-space:normal;min-width:12rem;max-width:28rem;text-align:left}
td.name{font-family:var(--body);font-weight:600;text-align:left}
tr.dim td{color:var(--muted)}
.r{color:var(--rep)} .d{color:var(--dem)} .n{color:var(--np)}
.pill{display:inline-block;font:700 .66rem var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neu{background:var(--soft);color:var(--muted)}
.note{font-size:.83rem;color:var(--muted);max-width:80ch;margin:0}
.banner{border-radius:8px;padding:10px 12px;font-size:.88rem;background:var(--warn-bg);color:var(--warn)}
.msg{font-size:.85rem;color:var(--muted);min-height:1.2em;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.86rem;color:var(--muted)}
.facts b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.gate{max-width:440px;margin:40px auto;display:grid;gap:12px}
.gate input{width:100%}
.copybox{width:100%;font:400 .82rem var(--mono);min-height:6rem}
.empty{color:var(--muted);font-family:var(--body);text-align:left;white-space:normal}
.ro .entry,.ro button[data-del]{display:none}
.ro select[data-status]{pointer-events:none;appearance:none;-webkit-appearance:none;border-color:transparent;background:none;padding-inline:0}
.banner a{color:inherit;font-weight:700}
.brief{border-left:4px solid var(--accent)}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:980px){.split.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:560px){input[type=number]{width:7rem}select,input.w-l{width:100%}h1{font-size:1.35rem}.mast img{height:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

(function(){
"use strict";
const REF=JSON.parse(document.getElementById('ref').textContent);
const C=REF.c; const COUNTIES=Object.keys(C).sort();
const METRO=['Polk','Linn','Scott','Johnson','Black Hawk','Story','Dubuque','Woodbury','Pottawattamie','Dallas','Warren'];
const KINDS=['crossover','counties','turnout','chase','incidents'];
const ALL=KINDS.concat(['source']);
const SITE='https://jatreat.github.io/lahn-tracker/';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n==null||!isFinite(n))?'–':Math.round(n).toLocaleString('en-US');
const pct=(v,d=1)=>isFinite(v)?(v*100).toFixed(d)+'%':'–';
const sgn=(v,d=1,suf=' pts')=>isFinite(v)?((v>=0?'+':'−')+Math.abs(v).toFixed(d)+suf):'–';

const now=()=>Date.now();
const hhmm=t=>{const d=new Date(t);return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'})};
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- storage: Claude shared database, Google Sheet, or this device ---------- */
const data={crossover:[],counties:[],turnout:[],chase:[],incidents:[],source:[]};
let brief=null, syncedAt=null;
let store=null, me={id:null,name:''}, userNs=null, names={};
const listeners=[];
function changed(){applySource();listeners.forEach(f=>f())}
// Claude-sourced rows: newer SOS absentee numbers by county, and Claude's written read
function applySource(){
  const a=data.source.find(r=>r.id==='absentee');
  if(a&&a.json){try{const j=typeof a.json==='string'?JSON.parse(a.json):a.json;for(const c in j.c){if(C[c]){const v=j.c[c];C[c][0]=+v[0];C[c][1]=+v[1];C[c][2]=+v[2];if(v[3]!=null)C[c][7]=+v[3]}}if(j.report)REF.report=j.report}catch(e){}}
  const b=data.source.find(r=>r.id==='brief');brief=b&&b.text?b:null;
}

function mirrorStore(db){
  // Read-only mirror of the team Google Sheet; Claude copies the Sheet into this page's database.
  const ro=()=>Promise.reject(new Error('Enter data on the team site'));
  return {mode:'mirror',label:'Mirror of team sheet',canWrite:false,
    start(){db.collection('mirror').onSnapshot(s=>{const parts={};ALL.forEach(k=>parts[k]=[]);
      s.docs.forEach(d=>{const v=d.data()||{};if(d.id==='meta'){syncedAt=v.syncedAt||null;return}if(parts[v.kind])parts[v.kind].push(v)});
      ALL.forEach(k=>{data[k]=parts[k].sort((a,b)=>(a.part||0)-(b.part||0)).flatMap(p=>Array.isArray(p.rows)?p.rows:[])});
      setMode(syncedAt?'Synced '+hhmm(syncedAt):'Mirror · waiting for first sync');changed()},e=>flash('Lost the live connection ('+e.code+'). Reload the page.'))},
    save:ro,patch:ro,remove:ro};
}
function sheetStore(url,key){
  let timer=null;
  async function call(body){body.key=key;const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(j.error||'request_failed');return j}
  async function pull(){try{const j=await call({action:'all'});ALL.forEach(k=>{data[k]=(j.data&&j.data[k])||[]});setMode('Shared · Google Sheet');changed()}catch(e){setMode('Sheet offline');flash('Could not reach the sheet: '+e.message+'. Retrying every 20 seconds.')}}
  return {mode:'sheet',label:'Shared · Google Sheet',canWrite:true,
    start(){pull();timer=setInterval(pull,20000)},
    async save(k,id,row){row.byName=me.name;row.at=now();await call({action:'save',kind:k,id:id||'',row});await pull()},
    async patch(k,id,p){p.at=now();await call({action:'patch',kind:k,id,row:p});await pull()},
    async remove(k,id){await call({action:'delete',kind:k,id});await pull()},
    ping:()=>call({action:'ping'})};
}
function localStore(){
  const KEY='lahn-tracker-local';
  const load=()=>{const v=ls.get(KEY);if(v)ALL.forEach(k=>data[k]=v[k]||[])};
  const persist=()=>ls.set(KEY,data);
  const rid=()=>Math.random().toString(36).slice(2,10);
  return {mode:'local',label:'Preview · this device only',canWrite:true,
    start(){load();changed()},
    async save(k,id,row){row.byName=me.name||'You';row.at=now();if(id){const i=data[k].findIndex(r=>r.id===id);if(i>=0)data[k][i]=Object.assign({id},row);else data[k].push(Object.assign({id},row))}else data[k].push(Object.assign({id:rid()},row));persist();changed()},
    async patch(k,id,p){p.at=now();const r=data[k].find(r=>r.id===id);if(r)Object.assign(r,p);persist();changed()},
    async remove(k,id){data[k]=data[k].filter(r=>r.id!==id);persist();changed()}};
}
function setMode(t){$('#modeTag').textContent=t}
async function resolveNames(){
  if(!userNs)return;const ids=new Set();KINDS.forEach(k=>data[k].forEach(r=>{if(r.by)ids.add(r.by);if(r.owner)ids.add(r.owner)}));
  if(!ids.size)return;try{const ps=await userNs.profiles([...ids]);let ch=false;for(const id in ps){const n=ps[id].name||'';if(names[id]!==n){names[id]=n;ch=true}}if(ch)changed()}catch(e){}
}
const who=r=>r.by?(names[r.by]||'Teammate'):(r.byName||'—');

/* ---------- tabs ---------- */
let tab='overview';
const VIEWS={};
function go(t){if(!VIEWS[t])t='overview';if(t!==tab)flashMsg='';tab=t;document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.t===t?'page':'false'));render()}
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
function render(){const m=$('#main');const keep=captureForm(m);m.innerHTML=VIEWS[tab].html();restoreForm(m,keep);VIEWS[tab].bind&&VIEWS[tab].bind(m)}
listeners.push(()=>{ if(store) render() });
// keep in-progress form input when live data re-renders the view
function captureForm(m){const o={};m.querySelectorAll('[data-keep]').forEach(el=>{o[el.id]=el.value});const f=document.activeElement;return {o,focus:f&&f.id&&m.contains(f)?f.id:null}}
function restoreForm(m,k){for(const id in k.o){const el=m.querySelector('#'+CSS.escape(id));if(el)el.value=k.o[id]}if(k.focus){const el=m.querySelector('#'+CSS.escape(k.focus));if(el)el.focus()}}
let flashMsg='';function flash(t){flashMsg=t;const el=document.getElementById('flash');if(el)el.textContent=t}
const countyOptions=(sel,id)=>`<select id="${id}" data-keep>${COUNTIES.map(c=>`<option${c===sel?' selected':''}>${esc(c)}</option>`).join('')}</select>`;
function head(title,lede){return (store&&store.mode==='local'?'<p class="banner">Preview mode: entries are saved only in this browser. Use the shared link from the campaign to enter real data.</p>':'')+(store&&store.mode==='mirror'?`<p class="banner">This page mirrors the team tracker${syncedAt?', last synced at '+hhmm(syncedAt):''}. Field entries go in on the <a href="${SITE}" target="_blank" rel="noopener">team site</a>.</p>`:'')+`<div><h1>${title}</h1><p class="lede">${lede}</p></div><p class="msg" id="flash" role="status">${esc(flashMsg)}</p>`}
function copyCSV(rows,cols,btn){
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const txt=[cols.map(c=>c[0]).join(',')].concat(rows.map(r=>cols.map(c=>q(c[1](r))).join(','))).join('\n');
  const box=btn.parentElement.parentElement.querySelector('.copybox');
  const fb=()=>{if(box){box.hidden=false;box.value=txt;box.select()}};
  try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy CSV',1500)},fb)}catch(e){fb()}
}
async function guard(fn,okText){try{await fn();flash(okText||'Saved.')}catch(e){flash('Not saved: '+(e&&(e.message||e.code)||'error')+'.')}}

/* ---------- models ---------- */
const DL_DEFAULT=0.96, NP_DEFAULT=0.55;
let dl=ls.get('lt-dl')||DL_DEFAULT, nps=ls.get('lt-nps')||NP_DEFAULT;
function crossCalc(r){const [R,D,N]=C[r.county];const T=R+D+N;const V=r.lahn+r.sand;const pR=R/T,pD=D/T,pN=N/T;const share=r.sand/V;const straight=pD*dl+pN*nps;const x=(share-straight)/pR;let split=null;if(r.hin!=null&&r.tur!=null&&(r.hin+r.tur)>0)split=r.hin/(r.hin+r.tur)-r.lahn/V;return {R,D,N,V,pR,pD,pN,share,straight,x,split}}
function solve3(A,b){const M=A.map((r,i)=>[...r,b[i]]);for(let i=0;i<3;i++){let p=i;for(let k=i+1;k<3;k++)if(Math.abs(M[k][i])>Math.abs(M[p][i]))p=k;[M[i],M[p]]=[M[p],M[i]];if(Math.abs(M[i][i])<1e-12)return null;for(let k=0;k<3;k++){if(k===i)continue;const f=M[k][i]/M[i][i];for(let j=i;j<4;j++)M[k][j]-=f*M[i][j]}}return [0,1,2].map(i=>M[i][3]/M[i][i])}
function crossSummary(){
  const rows=data.crossover.filter(r=>C[r.county]&&r.lahn+r.sand>0);let wx=0,w=0,sw=0,sv=0;const ks=rows.map(crossCalc);
  ks.forEach(k=>{wx+=k.x*k.pR*k.V;w+=k.pR*k.V;if(k.split!=null){sw+=k.split*k.V;sv+=k.V}});
  let fit=null;if(ks.length>=4){const A=[[0,0,0],[0,0,0],[0,0,0]],y=[0,0,0];ks.forEach(k=>{const v=[k.pD,k.pR,k.pN];for(let i=0;i<3;i++){y[i]+=k.V*v[i]*k.share;for(let j=0;j<3;j++)A[i][j]+=k.V*v[i]*v[j]}});fit=solve3(A,y)}
  const avg=w?wx/w:NaN;const x=fit&&fit[1]>=0&&fit[1]<=0.4?fit[1]:avg;
  let proj=NaN;if(isFinite(x)){const R=552000,D=448000,N=292000,O=6500,T=R+D+N+O;proj=100*(1-2*(R*x+D*dl+N*nps+O*.5)/T)}
  return {n:rows.length,avg,fit,split:sv?sw/sv:NaN,proj};
}
const band=x=>x<0?['neu','Check entry']:x<0.07?['ok','Low']:x<0.10?['warn','Watch']:['bad','High'];
function latestBy(rows){const m={};rows.forEach(r=>{if(!m[r.county]||(r.at||0)>(m[r.county].at||0))m[r.county]=r});return m}
function countyProjection(){
  const got=latestBy(data.counties.filter(r=>C[r.county]&&(r.lahn+r.sand)>0));const names=Object.keys(got);
  if(!names.length)return {n:0};
  let sw=0,sv=0,tf=0,tw=0;
  names.forEach(c=>{const r=got[c];const V=r.lahn+r.sand;const l=r.lahn/V;const [, , , ,rey,dej]=C[c];const r22=rey/(rey+dej);sw+=(l-r22)*V;sv+=V;const f=Math.min(Math.max((r.pct||0)/100,0.01),1);tf+=(V/f)/(rey+dej)*V;tw+=V});
  const swing=sw/sv, turn=tf/tw;let L=0,S=0;
  COUNTIES.forEach(c=>{const [, , , ,rey,dej]=C[c];const r22=rey/(rey+dej);const r=got[c];
    if(r){const V=r.lahn+r.sand;const f=Math.min(Math.max((r.pct||0)/100,0.01),1);const rest=V/f-V;const l=r.lahn/V;L+=r.lahn+rest*l;S+=r.sand+rest*(1-l)}
    else{const V=(rey+dej)*turn;const l=Math.min(Math.max(r22+swing,0),1);L+=V*l;S+=V*(1-l)}});
  const margin=100*(L-S)/(L+S);
  let hs=0,hv=0;names.forEach(c=>{const r=got[c];if(r.hin!=null&&r.tur!=null&&r.hin+r.tur>0){const V=r.lahn+r.sand;hs+=(r.hin/(r.hin+r.tur)-r.lahn/V)*V;hv+=V}});
  return {n:names.length,swing,turn,margin,split:hv?hs/hv:NaN,got};
}
const CURVE=[[7,0],[8,.08],[9,.15],[10,.22],[11,.29],[12,.36],[13,.43],[14,.50],[15,.57],[16,.64],[17,.73],[18,.83],[19,.92],[20,1]];
function expectedShare(t){const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');if(!m)return null;const h=+m[1]+(+m[2])/60;if(h<=7)return 0;if(h>=20)return 1;for(let i=1;i<CURVE.length;i++){if(h<=CURVE[i][0]){const [h0,v0]=CURVE[i-1],[h1,v1]=CURVE[i];return v0+(v1-v0)*(h-h0)/(h1-h0)}}return 1}
function pace(r){if(!r.ed22||!r.count)return null;const e=expectedShare(r.time);if(!e)return null;return r.count/(r.ed22*e)}
const paceTag=p=>p==null?'<span class="pill neu">No 2022 count</span>':p<0.85?'<span class="pill bad">Behind</span>':p<0.97?'<span class="pill warn">Slightly behind</span>':'<span class="pill ok">On pace</span>';
function chaseByCounty(){const m={};data.chase.forEach(r=>{if(!C[r.county])return;const a=m[r.county]||(m[r.county]={doors:0,calls:0,contacts:0,voted:0,rides:0,shifts:0});['doors','calls','contacts','voted','rides'].forEach(k=>a[k]+=(+r[k]||0));a.shifts++});return m}

/* ---------- Overview ---------- */
VIEWS.overview={html(){
  const cp=countyProjection(),cs=crossSummary(),cb=chaseByCounty();
  const tot={contacts:0,voted:0,rides:0};Object.values(cb).forEach(a=>{tot.contacts+=a.contacts;tot.voted+=a.voted;tot.rides+=a.rides});
  const open=data.incidents.filter(r=>r.status!=='Resolved'),hi=open.filter(r=>r.severity==='High');
  const behind=data.turnout.filter(r=>{const p=pace(r);return p!=null&&p<0.85});
  const projTxt=cp.n?(cp.margin>=0?'Lahn +':'Sand +')+Math.abs(cp.margin).toFixed(1):'–';
  const crossTxt=cs.n?pct(cs.fit&&cs.fit[1]>=0&&cs.fit[1]<=.4?cs.fit[1]:cs.avg):'–';

   <div class="kpi"><a href="#chase"><div class="v">${fmt(tot.voted)}</div><div class="k">Chase: confirmed voted · ${fmt(tot.contacts)} contacts · ${fmt(tot.rides)} rides</div></a></div>

/* ---------- Crossover Watch ---------- */

   ${rows.map(r=>{const k=crossCalc(r);const [b,l]=band(k.x);return `<tr><td class="name">${esc(r.county)}</td><td><span class="r">${fmt(k.R)}</span> / <span class="d">${fmt(k.D)}</span> / <span class="n">${fmt(k.N)}</span></td><td>${fmt(r.lahn)}</td><td>${fmt(r.sand)}</td><td>${pct(k.share)}</td><td>${pct(k.straight)}</td><td>${pct(k.x)} <span class="pill ${b}">${l}</span></td><td>${k.split==null?'–':sgn(k.split*100)}</td><td>+${C[r.county][3]}</td><td class="l">${esc(who(r))} · ${hhmm(r.at||0)}</td><td><button class="link" data-del="${esc(r.id)}" type="button">Remove</button></td></tr>`}).join('')||'<tr><td colspan="11" class="empty">No counties yet. Add the first absentee report above.</td></tr>'}

  <section class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2>By county</h2><label for="h-filter">Show<select id="h-filter"><option value="active"${filt==='active'?' selected':''}>Counties with shifts</option><option value="all"${filt==='all'?' selected':''}>All 99, most R ballots out first</option></select></label></div>
   <div class="tablebox"><table><thead><tr><th class="l">County</th><th>R ballots out</th><th>Contacts</th><th>Confirmed voted</th><th>Share of R ballots out</th><th>Doors</th><th>Calls</th><th>Rides</th><th>Shifts</th></tr></thead><tbody>
   ${shown.map(c=>{const a=cb[c]||{doors:0,calls:0,contacts:0,voted:0,rides:0,shifts:0};const out=C[c][7];const sh=out?a.voted/out:NaN;return `<tr${a.shifts?'':' class="dim"'}><td class="name">${esc(c)}</td><td>${fmt(out)}</td><td>${fmt(a.contacts)}</td><td>${fmt(a.voted)}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap;justify-content:flex-end"><div class="bar" aria-hidden="true"><i style="width:${Math.min(100,(sh||0)*100)}%"></i></div>${pct(sh,0)}</div></td><td>${fmt(a.doors)}</td><td>${fmt(a.calls)}</td><td>${fmt(a.rides)}</td><td>${a.shifts}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">No shifts logged yet. Switch to “All 99” to see where the most Republican ballots are still out.</td></tr>'}
   </tbody></table></div>
  </section>
  <section class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2>Recent shifts</h2><button id="h-csv" type="button">Copy CSV</button></div>
   <div class="tablebox"><table><thead><tr><th class="l">Time</th><th class="l">County</th><th class="l">Team</th><th>Doors</th><th>Calls</th><th>Contacts</th><th>Voted</th><th>Rides</th><th class="l">Notes</th><th class="l">By</th><th></th></tr></thead><tbody>
   ${recent.map(r=>`<tr><td class="l">${hhmm(r.at||0)}</td><td class="name">${esc(r.county)}</td><td class="l">${esc(r.team||'')}</td><td>${fmt(r.doors)}</td><td>${fmt(r.calls)}</td><td>${fmt(r.contacts)}</td><td>${fmt(r.voted)}</td><td>${fmt(r.rides)}</td><td class="t">${esc(r.note||'')}</td><td class="l">${esc(who(r))}</td><td><button class="link" data-del="${esc(r.id)}" type="button">Remove</button></td></tr>`).join('')||'<tr><td colspan="11" class="empty">No shifts yet.</td></tr>'}
   </tbody></table></div><textarea class="copybox" hidden readonly aria-label="CSV"></textarea>
  </section>`;
},bind(m){
  const sel=m.querySelector('#h-county');sel.addEventListener('change',()=>ls.set('lt-hc',sel.value));
  m.querySelector('#h-filter').addEventListener('change',e=>{ls.set('lt-hf',e.target.value);render()});
  m.querySelector('#h-add').addEventListener('click',()=>{const v=i=>num(m.querySelector(i).value)||0;const row={county:sel.value,team:m.querySelector('#h-team').value.trim().slice(0,80),doors:v('#h-doors'),calls:v('#h-calls'),contacts:v('#h-contacts'),voted:v('#h-voted'),rides:v('#h-rides'),note:m.querySelector('#h-note').value.trim().slice(0,500)};
    if(row.doors+row.calls+row.contacts+row.voted+row.rides<=0){flash('Enter at least one number for the shift.');return}
    ['#h-doors','#h-calls','#h-contacts','#h-voted','#h-rides','#h-note'].forEach(i=>m.querySelector(i).value='');
    guard(()=>store.save('chase',null,row),'Shift logged for '+row.county+'.')});
  m.querySelector('#h-csv').addEventListener('click',e=>copyCSV(data.chase,[['county',r=>r.county],['team',r=>r.team],['doors',r=>r.doors],['calls',r=>r.calls],['contacts',r=>r.contacts],['voted',r=>r.voted],['rides',r=>r.rides],['notes',r=>r.note],['entered',r=>new Date(r.at||0).toISOString()]],e.target));
  bindDelete(m,'chase');
}};

/* ---------- Incidents ---------- */
const TYPES=['Long lines','Machine or tabulator','Poll book or ID','Voter challenge','Electioneering','Ballots or supplies','Polling place access','Other'];
const SEV=['High','Medium','Low'];const STATUS=['Open','In progress','Resolved'];
VIEWS.incidents={html(){
  const filt=ls.get('lt-if')||'open';const rows=[...data.incidents].filter(r=>filt==='all'||r.status!=='Resolved').sort((a,b)=>SEV.indexOf(a.severity)-SEV.indexOf(b.severity)||(b.at||0)-(a.at||0));
  const open=data.incidents.filter(r=>r.status!=='Resolved');
  const sevPill=s=>`<span class="pill ${s==='High'?'bad':s==='Medium'?'warn':'neu'}">${esc(s)}</span>`;
  return head('Incident log','Problems at polling places, by severity. Anyone can update the status; resolved incidents drop off the open list.')+`
  <div class="kpis">
   <div class="kpi"><div class="v">${open.length}</div><div class="k">Open</div></div>
   <div class="kpi"><div class="v">${open.filter(r=>r.severity==='High').length}</div><div class="k">Open, high severity</div></div>
   <div class="kpi"><div class="v">${data.incidents.length-open.length}</div><div class="k">Resolved</div></div>
  </div>
  <section class="panel entry"><h2>Report an incident</h2>
   <div class="row">
    <label for="i-county">County${countyOptions(ls.get('lt-ic')||'Polk','i-county')}</label>
    <label for="i-loc">Polling place or precinct<input id="i-loc" class="w-l" type="text" autocomplete="off" data-keep></label>
    <label for="i-type">Type<select id="i-type" data-keep>${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></label>
    <label for="i-sev">Severity<select id="i-sev" data-keep>${SEV.map(s=>`<option${s==='Medium'?' selected':''}>${s}</option>`).join('')}</select></label>
    <label for="i-contact">Reporter phone (optional)<input id="i-contact" type="tel" autocomplete="off" data-keep></label>
   </div>
   <label for="i-desc">What happened<textarea id="i-desc" data-keep></textarea></label>
   <div class="row"><button class="primary" id="i-add" type="button">Report incident</button></div>
  </section>
  <section class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2>Incidents</h2><div class="row"><label for="i-filter">Show<select id="i-filter"><option value="open"${filt==='open'?' selected':''}>Open</option><option value="all"${filt==='all'?' selected':''}>All</option></select></label><button id="i-csv" type="button">Copy CSV</button></div></div>
   <div class="tablebox"><table><thead><tr><th class="l">Severity</th><th class="l">Reported</th><th class="l">County</th><th class="l">Where</th><th class="l">Type</th><th class="l">What happened</th><th class="l">Reporter</th><th class="l">Status</th><th></th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td class="l">${sevPill(r.severity)}</td><td class="l">${hhmm(r.created||r.at||0)}</td><td class="name">${esc(r.county)}</td><td class="l">${esc(r.location)}</td><td class="l">${esc(r.type)}</td><td class="t">${esc(r.desc)}</td><td class="l">${esc(who(r))}${r.contact?'<br><span class="n">'+esc(r.contact)+'</span>':''}</td><td class="l"><select data-status="${esc(r.id)}" aria-label="Status">${STATUS.map(s=>`<option${s===r.status?' selected':''}>${s}</option>`).join('')}</select></td><td><button class="link" data-del="${esc(r.id)}" type="button">Remove</button></td></tr>`).join('')||`<tr><td colspan="9" class="empty">${filt==='open'?'No open incidents.':'No incidents reported.'}</td></tr>`}
   </tbody></table></div><textarea class="copybox" hidden readonly aria-label="CSV"></textarea>
  </section>`;
},bind(m){
  const sel=m.querySelector('#i-county');sel.addEventListener('change',()=>ls.set('lt-ic',sel.value));
  m.querySelector('#i-filter').addEventListener('change',e=>{ls.set('lt-if',e.target.value);render()});
  m.querySelector('#i-add').addEventListener('click',()=>{const loc=m.querySelector('#i-loc').value.trim(),desc=m.querySelector('#i-desc').value.trim();
    if(!loc||!desc){flash('Enter where it is and what happened.');return}
    const row={county:sel.value,location:loc.slice(0,120),type:m.querySelector('#i-type').value,severity:m.querySelector('#i-sev').value,contact:m.querySelector('#i-contact').value.trim().slice(0,30),desc:desc.slice(0,800),status:'Open',created:now()};
    ['#i-loc','#i-desc','#i-contact'].forEach(i=>m.querySelector(i).value='');
    guard(()=>store.save('incidents',null,row),'Incident reported.')});
  m.querySelectorAll('select[data-status]').forEach(s=>s.addEventListener('change',()=>guard(()=>store.patch('incidents',s.dataset.status,{status:s.value}),'Status updated.')));
  m.querySelector('#i-csv').addEventListener('click',e=>copyCSV(data.incidents,[['severity',r=>r.severity],['status',r=>r.status],['county',r=>r.county],['location',r=>r.location],['type',r=>r.type],['description',r=>r.desc],['reporter_phone',r=>r.contact],['reported',r=>new Date(r.created||r.at||0).toISOString()]],e.target));
  bindDelete(m,'incidents');
}};

function bindDelete(m,k){m.querySelectorAll('button[data-del]').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.armed){guard(()=>store.remove(k,b.dataset.del),'Removed.');return}
  b.dataset.armed='1';b.textContent='Confirm remove';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Remove'}},4000)}))}

/* ---------- start ---------- */
function gate(){
  const cfg=window.TRACKER_CONFIG||{};const saved=ls.get('lt-sheet')||{};
  $('#main').innerHTML=`<div class="gate panel"><h1>Sign in to the tracker</h1><p class="lede">Enter your name and the team passcode from the campaign.</p>
   <label for="g-name">Your name<input id="g-name" type="text" autocomplete="name" value="${esc(saved.name||'')}"></label>
   <label for="g-key">Team passcode<input id="g-key" type="password" autocomplete="off"></label>
   <button class="primary" id="g-go" type="button">Open tracker</button><p class="msg" id="g-msg" role="status"></p></div>`;
  $('#g-go').addEventListener('click',async()=>{const name=$('#g-name').value.trim(),key=$('#g-key').value.trim();if(!name||!key){$('#g-msg').textContent='Enter your name and the passcode.';return}
    const s=sheetStore(cfg.sheetUrl,key);$('#g-msg').textContent='Checking…';try{await s.ping();ls.set('lt-sheet',{name,key});me.name=name;boot(s)}catch(e){$('#g-msg').textContent=e.message==='bad_passcode'?'That passcode didn’t work. Check it with the campaign.':'Could not reach the sheet ('+e.message+'). Check your connection and try again.'}});
}
function boot(s){store=s;setMode(s.label);document.body.classList.toggle('ro',!s.canWrite);$('#whoTag').textContent=me.name?('Signed in as '+me.name):'';
  go(location.hash.slice(1)||'overview');s.start()}
async function start(){
  go(location.hash.slice(1)||'overview');
  const cfg=window.TRACKER_CONFIG||{};
  if(window.claude&&typeof window.claude.use==='function'){
    const db=await window.claude.use('db');
    if(db){boot(mirrorStore(db));return}
  }
  if(cfg.sheetUrl){const saved=ls.get('lt-sheet');if(saved&&saved.key){const s=sheetStore(cfg.sheetUrl,saved.key);try{await s.ping();me.name=saved.name;boot(s);return}catch(e){}}gate();return}
  boot(localStore());
}
start();
})();
</script>
